
name: bev-claim

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bev-claim-backend:latest
    container_name: bev-claim-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "5001"
      TZ: Asia/Bangkok
      DB_SERVER: "${DOCKER_DB_SERVER:-host.docker.internal}"
      DB_PORT: "${DOCKER_DB_PORT:-1433}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - ./backend/src/uploads:/app/src/uploads
    networks:
      default:
        aliases:
          - bev-claim-backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /bev-claim/
        VITE_API_URL: /bev-claim/api
        VITE_API_BASE_URL: /bev-claim
        VITE_AUTO_CONFIRM_SUBMIT_SECONDS: "${VITE_AUTO_CONFIRM_SUBMIT_SECONDS:-86400}"
        VITE_AUTO_CONFIRM_RECEIVE_SECONDS: "${VITE_AUTO_CONFIRM_RECEIVE_SECONDS:-259200}"
    image: bev-claim-frontend:latest
    container_name: bev-claim-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
