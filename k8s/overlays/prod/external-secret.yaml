# สร้าง Secret bev-claim-backend-env จาก Vault (รูปแบบเดียวกับ bev-queue)
# path: lrdi-kv/bev-claim/prod
# property ต้องตรงกับ k8s/overlays/prod/secret.env.example — ถ้าใน Vault ขาด property ไหน ExternalSecret จะ error ทั้งก้อน
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lrdi-bev-claim-external-secret
  namespace: lrdi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-lrdi-k8s
    kind: SecretStore
  target:
    name: bev-claim-backend-env
    creationPolicy: Owner
  data:
    - secretKey: DB_SERVER
      remoteRef:
        key: lrdi-kv/bev-claim/prod
        property: DB_SERVER
    - secretKey: DB_USER
      remoteRef:
        key: lrdi-kv/bev-claim/prod
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: lrdi-kv/bev-claim/prod
        property: DB_PASSWORD
    - secretKey: DB_DATABASE
      remoteRef:
        key: lrdi-kv/bev-claim/prod
        property: DB_DATABASE
    - secretKey: JWT_SECRET
      remoteRef:
        key: lrdi-kv/bev-claim/prod
        property: JWT_SECRET
