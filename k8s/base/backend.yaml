apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bev-claim-uploads
  annotations:
    # เก็บไฟล์ที่ผู้ใช้อัปโหลด — ห้าม Argo CD prune/ลบ
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# api (Node.js + Socket.IO) — แยก deployment จาก web ตามแนวทาง Platform
#
# ห้าม scale เกิน 1 replica และต้องใช้ Recreate:
#   - PVC bev-claim-uploads เป็น ReadWriteOnce (เมานต์ได้ทีละ node)
#   - Socket.IO เก็บห้อง (staff, claim:<id>) ไว้ในหน่วยความจำของ pod — ถ้ามีหลาย pod
#     การแจ้งเตือน realtime จะไปไม่ถึงผู้ใช้ที่ต่ออยู่กับ pod อื่น
# restart ได้ตามปกติ (Argo CD > deploy bev-claim-backend > Restart)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bev-claim-backend
  labels: { app: bev-claim, tier: backend }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: bev-claim, tier: backend }
  template:
    metadata:
      labels: { app: bev-claim, tier: backend }
    spec:
      imagePullSecrets:
        - name: lrdi-image-pull-secret
      containers:
        - name: backend
          image: bev-claim-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - secretRef:
                name: bev-claim-backend-env
            - configMapRef:
                name: bev-claim-backend-config
          volumeMounts:
            - name: uploads
              mountPath: /app/src/uploads
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 512Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: bev-claim-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: bev-claim-backend
  labels: { app: bev-claim, tier: backend }
spec:
  type: ClusterIP
  selector: { app: bev-claim, tier: backend }
  ports:
    - name: http
      port: 5001
      targetPort: http
