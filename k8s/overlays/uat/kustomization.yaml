apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lrdi
resources:
  - ../../base
  - ingress.yaml
configMapGenerator:
  - name: bev-claim-backend-config
    behavior: merge
    literals:
      - DB_SERVER=10.7.34.41
      - DB_PORT=3306
      - BASE_URL=https://logisticssandbox-uat.thaibevapp.com/bev-claim
images:
  - name: bev-claim-frontend
    newName: CHANGE_ME_REGISTRY/lrdi/bev-claim-frontend
    newTag: "uat"
  - name: bev-claim-backend
    newName: CHANGE_ME_REGISTRY/lrdi/bev-claim-backend
    newTag: "uat"
