apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lrdi
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: bev-claim-backend-config
    behavior: merge
    literals:
      - DB_SERVER=host.docker.internal
      - DB_PORT=1434
images:
  - name: bev-claim-frontend
    newName: bev-claim-frontend
    newTag: latest
  - name: bev-claim-backend
    newName: bev-claim-backend
    newTag: latest
patches:
  - target: { kind: Service, name: bev-claim-frontend }
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 8081
