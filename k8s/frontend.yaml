# Frontend: Nginx เสิร์ฟ React + ส่งต่อ /api, /uploads, /socket.io ไปที่ Service "backend"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyclaim-frontend
  labels: { app: easyclaim, tier: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: easyclaim, tier: frontend }
  template:
    metadata:
      labels: { app: easyclaim, tier: frontend }
    spec:
      containers:
        - name: frontend
          image: easyclaim-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
---
# Docker Desktop: LoadBalancer เปิดที่ http://localhost:8080 (และ IP เครื่องในวง LAN)
apiVersion: v1
kind: Service
metadata:
  name: easyclaim-frontend
  labels: { app: easyclaim, tier: frontend }
spec:
  type: LoadBalancer
  selector: { app: easyclaim, tier: frontend }
  ports:
    - name: http
      port: 8080
      targetPort: http
