# K8S PROD — namespace lrdi — https://lrdi.thaibev.com/bev-claim/
#   kubectl -n lrdi create secret generic bev-claim-backend-env --from-env-file=<ไฟล์ .env ของ K8S PROD>
#   kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lrdi
resources:
  - ../../base
  - ingress.yaml
configMapGenerator:
  - name: bev-claim-backend-config
    behavior: merge
    literals:
      - DB_SERVER=CHANGE_ME_DB_HOST        # TODO: SQL Server ของ K8S PROD
      - DB_PORT=1433                       # TODO: ยืนยัน port
      - BASE_URL=https://lrdi.thaibev.com/bev-claim
images:
  - name: bev-claim-frontend
    newName: CHANGE_ME_REGISTRY/lrdi/bev-claim-frontend   # TODO: registry จริง
    newTag: "1.0.0"
  - name: bev-claim-backend
    newName: CHANGE_ME_REGISTRY/lrdi/bev-claim-backend    # TODO: registry จริง
    newTag: "1.0.0"
# ถ้า registry เป็น private ให้เปิดใช้ patch นี้ (สร้าง secret ชื่อ regcred ใน ns lrdi ก่อน)
