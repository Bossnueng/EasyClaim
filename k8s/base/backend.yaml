# Backend: Node/Express + Socket.IO (ภายใน cluster เท่านั้น — ภายนอกเข้าผ่าน Nginx ของ frontend)
# ค่าลับ (DB_USER, DB_PASSWORD, DB_DATABASE, JWT_SECRET ...) มาจาก Secret "bev-claim-backend-env"
# ค่าตาม environment (DB_SERVER, DB_PORT, BASE_URL) มาจาก ConfigMap "bev-claim-backend-config" ใน overlay
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bev-claim-uploads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bev-claim-backend
  labels: { app: bev-claim, tier: backend }
spec:
  # 1 replica: ไฟล์อัปโหลดเก็บบนดิสก์ (ReadWriteOnce) และ Socket.IO ยังไม่มี adapter สำหรับหลาย pod
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: bev-claim, tier: backend }
  template:
    metadata:
      labels: { app: bev-claim, tier: backend }
    spec:
      containers:
        - name: backend
          image: bev-claim-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - secretRef:
                name: bev-claim-backend-env
            # ConfigMap อยู่หลัง Secret -> ค่าใน ConfigMap ทับค่าจาก backend/.env
            - configMapRef:
                name: bev-claim-backend-config
          volumeMounts:
            - name: uploads
              mountPath: /app/src/uploads
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 512Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: bev-claim-uploads
---
# ชื่อ Service ต้องเป็น "bev-claim-backend" — docker/nginx.conf ส่งต่อไปที่ bev-claim-backend:5001
apiVersion: v1
kind: Service
metadata:
  name: bev-claim-backend
  labels: { app: bev-claim, tier: backend }
spec:
  type: ClusterIP
  selector: { app: bev-claim, tier: backend }
  ports:
    - name: http
      port: 5001
      targetPort: http
