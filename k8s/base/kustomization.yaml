# base ของ bev-claim (k8s/base) — ห้าม apply ตรงๆ ให้ใช้ overlay:
#   kubectl apply -k k8s/overlays/uat     (K8S UAT,  ns koka, https://koka-uat.thaibev.com/bev-claim/)
#   kubectl apply -k k8s/overlays/prod    (K8S PROD, ns koka, https://koka.thaibev.com/bev-claim/)
#   kubectl apply -k k8s/overlays/local   (Docker Desktop, http://localhost:8081/bev-claim/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: bev-claim
      app.kubernetes.io/part-of: koka
resources:
  - backend.yaml
  - frontend.yaml
configMapGenerator:
  - name: bev-claim-backend-config
    literals:
      - PORT=5001
      - TZ=Asia/Bangkok
      - NODE_ENV=production
