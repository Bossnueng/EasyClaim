
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bev_claim_backend {
    server bev-claim-backend:5001;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /bev-claim/;
    }

    location = /bev-claim {
        return 301 /bev-claim/;
    }

    location /bev-claim/api/ {
        proxy_pass http://bev_claim_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bev-claim;
        proxy_read_timeout 120s;
    }

    location /bev-claim/uploads/ {
        proxy_pass http://bev_claim_backend/uploads/;
        proxy_set_header Host $http_host;
        expires 7d;
    }

    location /bev-claim/socket.io/ {
        proxy_pass http://bev_claim_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://bev_claim_backend;
        proxy_set_header Host $http_host;
        expires 7d;
    }

    location /bev-claim/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /bev-claim/index.html {
        add_header Cache-Control "no-cache";
    }

    location /bev-claim/ {
        try_files $uri $uri/ /bev-claim/index.html;
    }
}
