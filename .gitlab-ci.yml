# bev-claim — GitLab CI/CD (UAT)
# master/main -> build image (tag = commit SHA) -> deploy UAT อัตโนมัติ
# PROD ทีมอื่นเป็นผู้ deploy: ส่งต่อ image tag (commit SHA) ที่ผ่าน UAT + overlay k8s/overlays/prod
# ต้องตั้ง CI/CD Variables: CUSTOM_REGISTRY, CUSTOM_REGISTRY_USER, CUSTOM_REGISTRY_PASSWORD,
#                         KUBECONFIG_UAT (File, scope uat)

stages: [build, deploy-uat]

variables:
  IMAGE_FE: $CUSTOM_REGISTRY/lrdi/bev-claim-frontend
  IMAGE_BE: $CUSTOM_REGISTRY/lrdi/bev-claim-backend
  TAG: $CI_COMMIT_SHORT_SHA

# ถ้าบริษัทกำหนด tag ของ runner ให้เปิดบรรทัดด้านล่างและใส่ชื่อ tag
# default:
#   tags: [docker]

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CUSTOM_REGISTRY_PASSWORD" | docker login -u "$CUSTOM_REGISTRY_USER" --password-stdin "$CUSTOM_REGISTRY"
    - docker build -t "$IMAGE_FE:$TAG" .
    - docker build -t "$IMAGE_BE:$TAG" ./backend
    - docker push "$IMAGE_FE:$TAG"
    - docker push "$IMAGE_BE:$TAG"

deploy-uat:
  stage: deploy-uat
  image:
    name: alpine/k8s:1.30.4
    entrypoint: [""]
  resource_group: uat
  variables:
    KUBECONFIG: $KUBECONFIG_UAT
  environment:
    name: uat
    url: https://logisticssandbox-uat.thaibevapp.com/bev-claim/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd k8s/overlays/uat
    - kustomize edit set image bev-claim-frontend=$IMAGE_FE:$TAG bev-claim-backend=$IMAGE_BE:$TAG
    - kubectl apply -k .
    - kubectl -n lrdi rollout status deployment/bev-claim-backend --timeout=300s
    - kubectl -n lrdi rollout status deployment/bev-claim-frontend --timeout=300s
